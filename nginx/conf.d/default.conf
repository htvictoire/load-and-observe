upstream fastapi_backend {
    server fastapi-backend:8000;
}

upstream nodejs_backend {
    server nodejs-backend:3000;
}

upstream grafana_backend {
    server grafana:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    location / {
        return 200 '
<!DOCTYPE html>
<html>
<head>
    <title>VPS Heavy Stack Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        .service { background: #f4f4f4; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .service a { color: #0066cc; text-decoration: none; font-weight: bold; }
        .status { color: #00aa00; }
    </style>
</head>
<body>
    <h1>VPS Heavy Stack Test Dashboard</h1>
    <p class="status">Nginx is running!</p>
    
    <h2>Available Services:</h2>
    
    <div class="service">
        <h3>Grafana Monitoring</h3>
        <p><a href="/grafana/" target="_blank">Open Grafana Dashboard</a></p>
        <p>Username: admin | Password: admin</p>
    </div>
    
    <div class="service">
        <h3>FastAPI Backend</h3>
        <p><a href="/api/docs" target="_blank">Open API Documentation</a></p>
        <p><a href="/api/health" target="_blank">Health Check</a></p>
    </div>
    
    <div class="service">
        <h3>Node.js Backend</h3>
        <p><a href="/node/health" target="_blank">Health Check</a></p>
        <p><a href="/node/" target="_blank">API Endpoint</a></p>
    </div>
    
    <div class="service">
        <h3>Prometheus</h3>
        <p><a href="/prometheus/" target="_blank">Open Prometheus</a></p>
    </div>
    
    <h2>System Info:</h2>
    <p>Total Containers: ~11 running</p>
    <p>Services: Nginx, FastAPI, Node.js, PostgreSQL, Redis, Celery, Prometheus, Grafana, Node Exporter, cAdvisor, Load Generator</p>
</body>
</html>';
        add_header Content-Type text/html;
    }

    location /api/ {
        proxy_pass http://fastapi_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /node/ {
        proxy_pass http://nodejs_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /grafana/ {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
