server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Extract container image
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

      # Add compose project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'

      # Add compose service label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'

      # Add container ID (short)
      - source_labels: ['__meta_docker_container_id']
        regex: '([a-f0-9]{12}).*'
        target_label: 'container_id'
        replacement: '$1'

      # Add image name
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'

      # Add network labels
      - source_labels: ['__meta_docker_container_network_mode']
        target_label: 'network_mode'

    # Pipeline stages for log processing
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            logger: logger
            message: msg
            timestamp: time

      # Extract log level from common patterns
      - regex:
          expression: '^(?P<level>DEBUG|INFO|WARN|ERROR|FATAL|CRITICAL)'

      # Set labels from extracted fields
      - labels:
          level:
          logger:

      # Add timestamp if available
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.999999999Z07:00"
            - "2006-01-02 15:04:05"

      # Output the final message
      - output:
          source: message

  # Specific scrape config for high-volume containers (optional)
  - job_name: docker_high_volume
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["log_volume=high"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'

    # More aggressive batching for high volume
    pipeline_stages:
      - match:
          selector: '{container=~"nginx.*|load-generator"}'
          stages:
            - drop:
                expression: ".*healthcheck.*"
                drop_counter_reason: "healthcheck"
